[project]
name = "news-crawler"
version = "0.1.0"
description = "VnEconomy RSS news crawler with FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "fastapi>=0.139.0",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "psycopg[binary]>=3.3.4",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "black>=26.5.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.black]
line-length = 88
target-version = ["py313"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]